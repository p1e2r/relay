# Relay: self-hosted messenger.
#   docker compose up -d                  # server + Postgres
#   docker compose --profile turn up -d   # also run a TURN server for calls behind strict NATs
services:
  relay:
    image: ${RELAY_IMAGE:-ghcr.io/p1e2r/relay-server:latest}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${RELAY_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://relay:${POSTGRES_PASSWORD:-relay}@db:5432/relay
    volumes:
      - relay-media:/data

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relay}
      POSTGRES_DB: relay
    volumes:
      - relay-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 5s
      retries: 10

  # TURN relay for calls when phones can't connect directly (mobile data / CGNAT).
  # Needs these forwarded on your router to this machine:
  #   3478 UDP + TCP, and 49160-49200 UDP (the relay range)
  # This one can NOT go through a Cloudflare tunnel (calls use UDP).
  turn:
    profiles: ["turn"]
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?set TURN_SECRET in .env}
      - --realm=relay
      - --external-ip=${TURN_EXTERNAL_IP:?set TURN_EXTERNAL_IP in .env}
      - --no-cli
      - --no-multicast-peers
      # never relay into your home network
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255

volumes:
  relay-db:
  relay-media:
